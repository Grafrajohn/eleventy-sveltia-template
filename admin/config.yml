# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main

media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: src/_data/home.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Highlighted heading text, name: headingAccent, widget: string }
              - { label: Introduction, name: introduction, widget: text }
              - { label: Button text, name: button, widget: string }
              - { label: Card badge, name: cardBadge, widget: string }
              - { label: Card heading, name: cardHeading, widget: string }
              - { label: Card text, name: cardText, widget: text }
          - label: About
            name: about
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
          - label: Highlights
            name: highlights
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: introduction, widget: string }
              - label: Cards
                name: cards
                widget: list
                min: 3
                max: 3
                fields:
                  - { label: Heading, name: heading, widget: string }
                  - { label: Text, name: text, widget: text }
